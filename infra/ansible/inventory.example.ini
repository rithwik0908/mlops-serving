[control_plane]
control-plane ansible_host=203.0.113.10 private_ip=10.0.0.10 ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[workers]
worker-1 ansible_host=10.0.0.11 private_ip=10.0.0.11 ansible_ssh_common_args='-o ProxyCommand="ssh -i ~/.ssh/YOUR_KEY -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p cc@203.0.113.10" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[chameleon:children]
control_plane
workers

[chameleon:vars]
ansible_user=cc
# WSL: copy .pem to Linux home and chmod 600 - /mnt/c/... keys are often rejected by OpenSSH.
ansible_ssh_private_key_file=~/.ssh/YOUR_KEY
# Quiets interpreter discovery warnings on Ubuntu 24.04 / k3s VMs:
ansible_python_interpreter=/usr/bin/python3.12
