---
- name: Install Sealed Secrets controller and bootstrap runtime secrets
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"
    repo_root: "/opt/mlops_project"
    public_floating_ip: "{{ hostvars[groups['control_plane'][0]].ansible_host }}"
    public_nip_base: "{{ lookup('env', 'PUBLIC_NIP_BASE') | default(public_floating_ip ~ '.nip.io', true) }}"
    bootstrap_secret_dir: "/home/{{ ansible_user }}/bootstrap-secrets"
    apply_static_sealed_secrets: "{{ lookup('env', 'APPLY_STATIC_SEALED_SECRETS') | default('false', true) | lower in ['1', 'true', 'yes', 'y'] }}"
    minio_root_user: "{{ lookup('env', 'MINIO_ROOT_USER') | default('minioadmin', true) }}"
    minio_root_password: "{{ lookup('env', 'MINIO_ROOT_PASSWORD') | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}"
    tls_cert_file: "{{ lookup('env', 'CHAMELEON_TLS_CERT_FILE') | default('', true) }}"
    tls_key_file: "{{ lookup('env', 'CHAMELEON_TLS_KEY_FILE') | default('', true) }}"
    tls_namespaces:
      - ml-platform
      - monitoring
      - ml-serving
      - zulip
  tasks:
    - name: Ensure openssl is installed
      ansible.builtin.package:
        name: openssl
        state: present

    - name: Ensure repo root directory exists
      ansible.builtin.file:
        path: "{{ repo_root }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy k8s manifests to VM
      ansible.builtin.copy:
        src: "../../../k8s/"
        dest: "{{ repo_root }}/k8s/"
        mode: "0644"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Apply Sealed Secrets controller
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -k {{ repo_root }}/k8s/addons/sealed-secrets/

    - name: Wait for sealed-secrets controller rollout
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        rollout status deployment/sealed-secrets-controller -n kube-system
        --timeout=180s
      register: sealed_rollout
      changed_when: false
      failed_when: sealed_rollout.rc != 0

    - name: Ensure bootstrap secret directory exists on VM
      ansible.builtin.file:
        path: "{{ bootstrap_secret_dir }}"
        state: directory
        mode: "0700"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy provided TLS certificate to VM
      ansible.builtin.copy:
        src: "{{ tls_cert_file }}"
        dest: "{{ bootstrap_secret_dir }}/chameleon-nip-tls.crt"
        mode: "0600"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      when: tls_cert_file | length > 0

    - name: Copy provided TLS private key to VM
      ansible.builtin.copy:
        src: "{{ tls_key_file }}"
        dest: "{{ bootstrap_secret_dir }}/chameleon-nip-tls.key"
        mode: "0600"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      when: tls_key_file | length > 0

    - name: Generate self-signed nip.io TLS certificate when no local cert/key are provided
      ansible.builtin.shell: |
        set -euo pipefail
        cat > "{{ bootstrap_secret_dir }}/openssl-nip.cnf" <<EOF
        [req]
        distinguished_name = req_distinguished_name
        x509_extensions = v3_req
        prompt = no

        [req_distinguished_name]
        CN = zulip.{{ public_nip_base }}

        [v3_req]
        subjectAltName = @alt_names

        [alt_names]
        DNS.1 = zulip.{{ public_nip_base }}
        DNS.2 = mlflow.{{ public_nip_base }}
        DNS.3 = minio.{{ public_nip_base }}
        DNS.4 = minio-console.{{ public_nip_base }}
        DNS.5 = grafana.{{ public_nip_base }}
        DNS.6 = prometheus.{{ public_nip_base }}
        DNS.7 = zulip-bridge.{{ public_nip_base }}
        DNS.8 = tone-api-staging.{{ public_nip_base }}
        DNS.9 = tone-api-canary.{{ public_nip_base }}
        DNS.10 = tone-api-prod.{{ public_nip_base }}
        EOF
        openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
          -keyout "{{ bootstrap_secret_dir }}/chameleon-nip-tls.key" \
          -out "{{ bootstrap_secret_dir }}/chameleon-nip-tls.crt" \
          -config "{{ bootstrap_secret_dir }}/openssl-nip.cnf"
      args:
        executable: /bin/bash
      when: tls_cert_file | length == 0 or tls_key_file | length == 0

    - name: Check whether minio-root already exists in ml-platform
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        get secret minio-root -n ml-platform
      register: minio_root_secret_check
      failed_when: false
      changed_when: false

    - name: Create minio-root in ml-platform when missing
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig {{ kubeconfig_path }} create secret generic minio-root -n ml-platform \
          --from-literal=root-user='{{ minio_root_user }}' \
          --from-literal=root-password='{{ minio_root_password }}'
      args:
        executable: /bin/bash
      when: minio_root_secret_check.rc != 0
      no_log: true

    - name: Read existing minio-root values from ml-platform
      ansible.builtin.shell: |
        set -euo pipefail
        ROOT_USER="$(kubectl --kubeconfig {{ kubeconfig_path }} get secret minio-root -n ml-platform -o jsonpath='{.data.root-user}' | base64 -d)"
        ROOT_PASSWORD="$(kubectl --kubeconfig {{ kubeconfig_path }} get secret minio-root -n ml-platform -o jsonpath='{.data.root-password}' | base64 -d)"
        printf '%s\n%s\n' "$ROOT_USER" "$ROOT_PASSWORD"
      args:
        executable: /bin/bash
      register: minio_root_secret_values
      changed_when: false
      no_log: true

    - name: Ensure minio-root exists in workload namespaces using the ml-platform value
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig {{ kubeconfig_path }} create secret generic minio-root -n {{ item }} \
          --from-literal=root-user='{{ minio_root_secret_values.stdout_lines[0] }}' \
          --from-literal=root-password='{{ minio_root_secret_values.stdout_lines[1] }}' \
          --dry-run=client -o yaml | kubectl --kubeconfig {{ kubeconfig_path }} apply -f -
      args:
        executable: /bin/bash
      loop:
        - ml-data
        - ml-training
        - ml-serving
      no_log: true

    - name: Check whether grafana-admin already exists in monitoring
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        get secret grafana-admin -n monitoring
      register: grafana_admin_secret_check
      failed_when: false
      changed_when: false

    - name: Create grafana-admin secret when missing
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig {{ kubeconfig_path }} create secret generic grafana-admin -n monitoring \
          --from-literal=admin-password='{{ grafana_admin_password }}'
      args:
        executable: /bin/bash
      when: grafana_admin_secret_check.rc != 0
      no_log: true

    - name: Create or update chameleon-nip-tls in required namespaces
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig {{ kubeconfig_path }} create secret tls chameleon-nip-tls -n {{ item }} \
          --cert="{{ bootstrap_secret_dir }}/chameleon-nip-tls.crt" \
          --key="{{ bootstrap_secret_dir }}/chameleon-nip-tls.key" \
          --dry-run=client -o yaml | kubectl --kubeconfig {{ kubeconfig_path }} apply -f -
      args:
        executable: /bin/bash
      loop: "{{ tls_namespaces }}"

    - name: Apply centralized sealed secrets when explicitly enabled
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -k {{ repo_root }}/k8s/secrets/
      when: apply_static_sealed_secrets
