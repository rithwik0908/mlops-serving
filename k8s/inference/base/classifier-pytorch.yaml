# Primary classifier for tiered deploys (staging / canary / production).
# ONNX and quantized variants live under ../backends/ (single shared pool).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier-pytorch
  labels:
    app: classifier-pytorch
    role: serving
    backend: pytorch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classifier-pytorch
  template:
    metadata:
      labels:
        app: classifier-pytorch
        role: serving
        backend: pytorch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: classifier-pytorch
          image: ghcr.io/allusudharshanrao/mlops-serving-classifier:latest
          # Always: after CI pushes a new :latest (e.g. torch added), nodes must not reuse an old cached tag.
          imagePullPolicy: Always
          command:
            - sh
            - -c
          args:
            - |
              python -c "import boto3" >/dev/null 2>&1 || python -m pip install --no-cache-dir boto3
              exec uvicorn app:app --host 0.0.0.0 --port 8001 --workers 1
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SERVING_BACKEND
              value: "pytorch"
            - name: MODEL_PATH
              value: "distilbert-base-uncased"
            - name: DUMMY_MODE
              value: "true"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.ml-platform.svc.cluster.local:5000"
            # Model Registry artifacts on MinIO — copy Secret minio-root from ml-platform into ml-serving.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.ml-platform.svc.cluster.local:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
          # /ready = 503 until model thread finishes (see serving/classifier app.py).
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            # Staging (DUMMY_MODE) is light; prod/canary load PyTorch+MLflow models — keep >=2Gi limit.
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: classifier-pytorch
  labels:
    app: classifier-pytorch
spec:
  type: ClusterIP
  selector:
    app: classifier-pytorch
  ports:
    - name: http
      port: 8001
      targetPort: http
