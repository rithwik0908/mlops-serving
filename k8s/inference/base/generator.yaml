# Tone generator — tier overlays patch CLASSIFIER_URL and DUMMY_MODE.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tone-generator
  labels:
    app: tone-generator
    role: serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tone-generator
  template:
    metadata:
      labels:
        app: tone-generator
        role: serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8010"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: tone-generator-code
          configMap:
            name: tone-generator-code
            defaultMode: 0444
      containers:
        - name: tone-generator
          image: ghcr.io/allusudharshanrao/mlops-serving-generator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8010
              name: http
          env:
            - name: DUMMY_MODE
              value: "true"
            - name: GENERATOR_BACKEND
              value: "seq2seq"
            - name: MODEL_NAME
              value: "google/flan-t5-base"
            - name: PEFT_MODEL_PATH
              value: ""
            - name: GENERATOR_MODEL_URI
              value: ""
            - name: CLASSIFIER_URL
              value: "http://classifier-pytorch:8001"
            - name: LATENCY_BUDGET_MS
              value: "600"
            - name: GENERATOR_MAX_CONCURRENT
              value: "1"
            - name: GENERATOR_MAX_QUEUE_WAIT_MS
              value: "250"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.ml-platform.svc.cluster.local:5000"
            - name: MLFLOW_ARTIFACT_PATH
              value: "lora_checkpoint"
            - name: MLFLOW_DOWNLOAD_DIR
              value: "/tmp/mlflow_artifacts"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.ml-platform.svc.cluster.local:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
          volumeMounts:
            - name: tone-generator-code
              mountPath: /app/model.py
              subPath: model.py
              readOnly: true
          # /ready stays 503 until the generator thread finishes MLflow download + HF model load.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            # Tuned for single-node ~32Gi clusters: low requests improve scheduling;
            # limits still allow Flan-T5 / short bursts (watch OOM if DUMMY_MODE=false + large models).
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "6Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: tone-generator
  labels:
    app: tone-generator
spec:
  type: ClusterIP
  selector:
    app: tone-generator
  ports:
    - name: http
      port: 8010
      targetPort: http
