---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlflow-sqlite-backup
  namespace: ml-platform
  labels:
    app: backup
    component: mlflow
spec:
  schedule: "45 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: backup
            component: mlflow
        spec:
          nodeSelector:
            mlops.storage: block
          restartPolicy: Never
          volumes:
            - name: mlflow-data
              persistentVolumeClaim:
                claimName: mlflow-data
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
          containers:
            - name: mlflow-backup
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  apk add --no-cache gzip >/dev/null
                  python -m pip install --no-cache-dir boto3 >/dev/null
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  RAW="/tmp/mlflow-${TS}.db"
                  OUT="/tmp/mlflow-${TS}.db.gz"
                  python /scripts/backup_sqlite.py /mlflow/data/mlflow.db "${RAW}"
                  gzip -9 "${RAW}"
                  python /scripts/upload_file.py "${OUT}" "ml-platform/mlflow/${TS}.db.gz"
              env:
                - name: OBJECTSTORE_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: chameleon-objectstore-backup
                      key: endpoint
                - name: OBJECTSTORE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: chameleon-objectstore-backup
                      key: bucket
                - name: OBJECTSTORE_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: chameleon-objectstore-backup
                      key: prefix
                - name: OBJECTSTORE_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: chameleon-objectstore-backup
                      key: access-key
                - name: OBJECTSTORE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: chameleon-objectstore-backup
                      key: secret-key
                - name: OBJECTSTORE_REGION
                  valueFrom:
                    secretKeyRef:
                      name: chameleon-objectstore-backup
                      key: region
              volumeMounts:
                - name: mlflow-data
                  mountPath: /mlflow/data
                  readOnly: true
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: "100m"
                  memory: 256Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
