# MLflow tracking server (shared experiment UI + SQLite backend on PVC).
# Artifacts use MinIO (S3) so any pod (e.g. classifier in ml-serving) can download_model
# via the tracking API — local /mlflow/data/artifacts breaks cross-namespace serving.
# After switching artifact root, re-run training + register Job so new versions use s3:// paths.
# Image pin: align with course/lab expectations; bump only after smoke-testing.
# Apply: kubectl apply -k k8s/platform/mlflow/ (or Ansible deploy_platform).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-platform
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
      # MLflow UI does not expose Prometheus /metrics on :5000 — do not annotate for pod scrape
      # (Prometheus would 404). Use mlflow-export or a sidecar if you need MLflow metrics later.
    spec:
      nodeSelector:
        mlops.storage: block
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.14.3
          args:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            # SQLite on PVC — sufficient for class scale; use Postgres for multi-replica.
            - --backend-store-uri=sqlite:////mlflow/data/mlflow.db
            # Same bucket as data/training stack; prefix isolates MLflow blobs (MinIO auto-creates keys).
            - --default-artifact-root=s3://zulip-rewriter/mlflow-artifacts/
          # boto3/MLflow use AWS_* names for any S3 API — values are MinIO keys; endpoint is in-cluster MinIO, not AWS.
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.ml-platform.svc.cluster.local:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: data
              mountPath: /mlflow/data
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
