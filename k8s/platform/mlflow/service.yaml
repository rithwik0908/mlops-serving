# NodePort added so cross-node pods (worker, hostNetwork) can reach MLflow via host IP.
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml-platform
  labels:
    app: mlflow
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
