# Prometheus (metrics + rules) + Grafana (dashboards) + Alertmanager; PVC-backed TSDB and Grafana lib.
# Apply after namespace monitoring exists and Secret grafana-admin is present (see deploy_platform / GETTING_STARTED).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rbac.yaml
  - deployment-kube-state-metrics.yaml
  - daemonset-node-exporter.yaml
  - configmap-prometheus.yaml
  - configmap-alertmanager.yaml
  - pvc-prometheus.yaml
  - deployment-prometheus.yaml
  - deployment-alertmanager.yaml
  - configmap-grafana-datasources.yaml
  - configmap-grafana-dashboard-provider.yaml
  - pvc-grafana.yaml
  - deployment-grafana.yaml
  - ingress-grafana.yaml
  - ingress-prometheus.yaml
configMapGenerator:
  - name: grafana-dashboard-ml-serving
    options:
      labels:
        app: grafana
      disableNameSuffixHash: true
    files:
      - dashboards/ml-serving-tone.json
      - dashboards/infra-health.json
      - dashboards/data-pipeline-quality.json
