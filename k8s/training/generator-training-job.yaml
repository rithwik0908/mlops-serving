---
apiVersion: batch/v1
kind: Job
metadata:
  name: generator-training
  namespace: ml-training
  labels:
    app: generator-training
    role: training
    model: llm-generator
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 21600
  template:
    metadata:
      labels:
        app: generator-training
        role: training
        model: llm-generator
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: pull-datasets
          image: minio/mc:RELEASE.2025-02-21T16-00-46Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ENDPOINT
              value: "http://minio.ml-platform.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "zulip-rewriter"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
          command:
            - sh
            - -c
            - |
              set -eu
              TRIES=0
              MAX=24
              until mc alias set platform "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null 2>&1; do
                TRIES=$((TRIES+1))
                if [ "$TRIES" -ge "$MAX" ]; then
                  echo "ERROR: MinIO not reachable after $((MAX*5))s"
                  exit 1
                fi
                echo "MinIO not ready ($TRIES/$MAX), sleeping 5s..."
                sleep 5
              done
              mc ls "platform/$MINIO_BUCKET" >/dev/null
              mkdir -p /data/raw /data/batch
              mc cp --recursive "platform/$MINIO_BUCKET/raw/" /data/raw/ || true
              mc cp --recursive "platform/$MINIO_BUCKET/batch/" /data/batch/ || true
          volumeMounts:
            - name: training-data
              mountPath: /data
      containers:
        - name: generator-training
          image: ghcr.io/allusudharshanrao/mlops-training-generator:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              python -c "import boto3" >/dev/null 2>&1 || python -m pip install --no-cache-dir boto3
              exec python /app/train_llm.py --config /app/configs/llm_generator_small.yaml
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.ml-platform.svc.cluster.local:5000"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "teamchat_tone_generator_llm"
            - name: MINIO_ENDPOINT
              value: "minio.ml-platform.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "zulip-rewriter"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.ml-platform.svc.cluster.local:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: DEVICE
              value: "cpu"
            - name: NUM_EPOCHS
              value: "3"
            - name: BATCH_SIZE
              value: "8"
          volumeMounts:
            - name: training-data
              mountPath: /data
            - name: output
              mountPath: /output
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
      volumes:
        - name: training-data
          emptyDir: {}
        - name: output
          emptyDir: {}
