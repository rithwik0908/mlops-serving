[project]
name = "zulip-data-quality-monitoring"
version = "0.1.0"
description = "Data quality and monitoring checks for the Zulip tone assistant data pipeline."
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "PyYAML>=6.0.1",
]

[project.scripts]
zulip-data-quality = "zulip_data_quality_monitoring.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
